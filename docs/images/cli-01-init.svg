<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Étape 1 — Initialiser le projet"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#edf4fb}.cmd{fill:#4be297;font-weight:700}.cyan{fill:#35d8ff;font-weight:700}.muted{fill:#91a3b6}</style><rect width="1400" height="900" rx="24" fill="url(#bg)"/><g opacity=".2" stroke="#26364b"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400M0 600H1400M0 700H1400M0 800H1400"/><path d="M140 0V900M280 0V900M420 0V900M560 0V900M700 0V900M840 0V900M980 0V900M1120 0V900M1260 0V900"/></g><rect x="42" y="34" width="12" height="58" rx="6" fill="#35d8ff"/><text class="ui" x="76" y="70" fill="#f7fbff" font-size="34" font-weight="700">Étape 1 — Initialiser le projet</text><text class="ui" x="76" y="106" fill="#91a3b6" font-size="20">Sélection des modèles Ollama Cloud, optimisation des tokens et initialisation de Git.</text><rect x="42" y="145" width="1316" height="650" rx="18" fill="#070b10" stroke="#2d3b4e" stroke-width="2"/><circle cx="72" cy="174" r="7" fill="#ff6b73"/><circle cx="96" cy="174" r="7" fill="#ffcd5c"/><circle cx="120" cy="174" r="7" fill="#4be297"/><text class="ui" x="1215" y="181" fill="#91a3b6" font-size="15">Terminal</text><g class="t"><text class="cmd" x="76" y="220">$ cd /Users/zub/CCB-TEMPLATE</text><text class="cmd" x="76" y="252">$ ./ccb-template init ~/Desktop/mon-projet</text><text x="76" y="296">Project name [mon-projet]: Mon projet</text><text x="76" y="340">Choose the Ollama Cloud model for manager:</text><text x="76" y="372">  1) glm-5.2:cloud</text><text x="76" y="404">  2) qwen3.5:397b-cloud</text><text x="76" y="436">  3) kimi-k2.7-code:cloud</text><text x="76" y="468">  4) kimi-k2.6:cloud</text><text class="cyan" x="76" y="500">&gt; 1</text><text x="76" y="538">Choose the Ollama Cloud model for graph:     &gt; 2</text><text x="76" y="570">Choose the Ollama Cloud model for developer: &gt; 3</text><text x="76" y="602">Choose the Ollama Cloud model for reviewer:  &gt; 4</text><text x="76" y="646">Enable token optimization (RTK + Tilth)? [Y/n] y</text><text x="76" y="678">Git: initialise repository</text><text x="76" y="710">Continue? [y/N] y</text><text class="cyan" x="76" y="742">Git repository initialised: ~/Desktop/mon-projet/.git</text><text x="76" y="774">Create an initial CCB brief now? [y/N] n</text></g><circle cx="58" cy="835" r="4" fill="#35d8ff"/><text class="ui" x="76" y="842" fill="#91a3b6" font-size="18">Exemple illustratif : l’ordre numérique dépend de la sortie locale de « ollama list ».</text><circle cx="58" cy="867" r="4" fill="#35d8ff"/><text class="ui" x="76" y="874" fill="#91a3b6" font-size="18">Le CLI initialise Git, mais ne crée aucun commit et ne pousse rien.</text></svg>