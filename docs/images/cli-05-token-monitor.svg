<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-label="Étape optionnelle — Suivre les tokens"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#edf4fb}.cmd{fill:#4be297;font-weight:700}.cyan{fill:#35d8ff;font-weight:700}</style><rect width="1400" height="650" rx="24" fill="url(#bg)"/><g opacity=".2" stroke="#26364b"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400M0 600H1400"/><path d="M140 0V650M280 0V650M420 0V650M560 0V650M700 0V650M840 0V650M980 0V650M1120 0V650M1260 0V650"/></g><rect x="42" y="34" width="12" height="58" rx="6" fill="#35d8ff"/><text class="ui" x="76" y="70" fill="#f7fbff" font-size="34" font-weight="700">Étape optionnelle — Suivre les tokens</text><text class="ui" x="76" y="106" fill="#91a3b6" font-size="20">Le proxy local enregistre uniquement les métadonnées d’usage, jamais les prompts ni les réponses.</text><rect x="42" y="145" width="1316" height="415" rx="18" fill="#070b10" stroke="#2d3b4e" stroke-width="2"/><circle cx="72" cy="174" r="7" fill="#ff6b73"/><circle cx="96" cy="174" r="7" fill="#ffcd5c"/><circle cx="120" cy="174" r="7" fill="#4be297"/><text class="ui" x="1215" y="181" fill="#91a3b6" font-size="15">Terminal</text><g class="t"><text class="cmd" x="76" y="220">$ ./ccb-template usage ~/Desktop/mon-projet</text><text x="76" y="260">No token usage recorded yet.</text><text class="cmd" x="76" y="316">$ ./ccb-template monitor watch ~/Desktop/mon-projet</text><text class="cyan" x="76" y="356">Token monitor started (pid &lt;PID&gt;).</text><text x="76" y="400">CCB token monitoring — refreshes every 2 seconds (Ctrl-C to stop)</text><text x="76" y="448">AGENT       MODEL                         INPUT      OUTPUT     REQUESTS</text><text x="76" y="480">manager     glm-5.2:cloud                     0           0            0</text></g><circle cx="58" cy="603" r="4" fill="#35d8ff"/><text class="ui" x="76" y="610" fill="#91a3b6" font-size="18">Les compteurs restent à zéro lorsqu’Ollama ne renvoie pas de métadonnées de tokens.</text></svg>