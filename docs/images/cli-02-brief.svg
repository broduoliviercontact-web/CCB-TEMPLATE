<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img" aria-label="Étape 2 — Créer un brief"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#edf4fb}.cmd{fill:#4be297;font-weight:700}.violet{fill:#a982ff;font-weight:700}</style><rect width="1400" height="670" rx="24" fill="url(#bg)"/><g opacity=".2" stroke="#26364b"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400M0 600H1400"/><path d="M140 0V670M280 0V670M420 0V670M560 0V670M700 0V670M840 0V670M980 0V670M1120 0V670M1260 0V670"/></g><rect x="42" y="34" width="12" height="58" rx="6" fill="#a982ff"/><text class="ui" x="76" y="70" fill="#f7fbff" font-size="34" font-weight="700">Étape 2 — Créer un brief</text><text class="ui" x="76" y="106" fill="#91a3b6" font-size="20">Codex aide à transformer l’idée en objectif, périmètre, critères d’acceptation et risques.</text><rect x="42" y="145" width="1316" height="420" rx="18" fill="#070b10" stroke="#2d3b4e" stroke-width="2"/><circle cx="72" cy="174" r="7" fill="#ff6b73"/><circle cx="96" cy="174" r="7" fill="#ffcd5c"/><circle cx="120" cy="174" r="7" fill="#4be297"/><text class="ui" x="1215" y="181" fill="#91a3b6" font-size="15">Terminal</text><g class="t"><text class="cmd" x="76" y="220">$ ./ccb-template brief ~/Desktop/mon-projet</text><text x="76" y="258">Describe the requested work. End with a line containing only a dot (.):</text><text x="76" y="306">Objectif : ajouter une page de connexion accessible.</text><text x="76" y="338">Périmètre : interface, validation et tests.</text><text x="76" y="370">Critères : tests verts, aucune régression, documentation mise à jour.</text><text x="76" y="402">Risques : compatibilité mobile et gestion des erreurs.</text><text class="violet" x="76" y="440">.</text><text class="violet" x="76" y="498">Brief created: ~/Desktop/mon-projet/.ccb/briefs/brief-YYYYMMDD-HHMMSS.md</text></g><circle cx="58" cy="610" r="4" fill="#a982ff"/><text class="ui" x="76" y="617" fill="#91a3b6" font-size="18">La saisie se termine par une ligne contenant uniquement un point « . ».</text></svg>