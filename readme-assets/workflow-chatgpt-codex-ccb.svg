<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Workflow ChatGPT Codex CCB-TEMPLATE</title><desc id="d">Sept étapes de l’idée au développement multi-agents local</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a24"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><rect width="1600" height="900" rx="24" fill="url(#b)"/><text x="55" y="64" fill="#f4f8fb" font-family="Inter,Segoe UI,Arial" font-size="38" font-weight="800">Workflow de projet : ChatGPT → Codex → CCB-TEMPLATE</text><text x="58" y="99" fill="#93a5b8" font-family="Inter,Segoe UI,Arial" font-size="20">De l’idée au développement multi-agents local</text><g font-family="Inter,Segoe UI,Arial"><g transform="translate(55 140)"><rect width="350" height="245" rx="18" fill="#151e29" stroke="#35d8ff"/><circle cx="35" cy="38" r="21" fill="#102532" stroke="#35d8ff"/><text x="35" y="46" text-anchor="middle" fill="#35d8ff" font-size="22" font-weight="800">1</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">ChatGPT — Idée produit</text><text x="24" y="92" fill="#d9e3ed" font-size="17">Discussion, besoins utilisateur,</text><text x="24" y="119" fill="#d9e3ed" font-size="17">fonctionnalités possibles.</text><rect x="24" y="180" width="250" height="36" rx="18" fill="#102532" stroke="#35d8ff"/><text x="40" y="204" fill="#35d8ff" font-size="14">Ne modifie pas le dépôt local</text></g><g transform="translate(425 140)"><rect width="350" height="245" rx="18" fill="#151e29" stroke="#a982ff"/><circle cx="35" cy="38" r="21" fill="#241b3b" stroke="#a982ff"/><text x="35" y="46" text-anchor="middle" fill="#a982ff" font-size="22" font-weight="800">2</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">Codex — Copilote</text><text x="24" y="92" fill="#d9e3ed" font-size="17">Périmètre, critères, risques</text><text x="24" y="119" fill="#d9e3ed" font-size="17">et plan technique vérifiable.</text><rect x="24" y="180" width="296" height="36" rx="18" fill="#241b3b" stroke="#a982ff"/><text x="40" y="204" fill="#a982ff" font-size="14">Connaît le dépôt et vérifie les fichiers</text></g><g transform="translate(795 140)"><rect width="350" height="245" rx="18" fill="#151e29" stroke="#4be297"/><circle cx="35" cy="38" r="21" fill="#102a21" stroke="#4be297"/><text x="35" y="46" text-anchor="middle" fill="#4be297" font-size="22" font-weight="800">3</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">Initialiser le projet</text><rect x="24" y="75" width="302" height="70" rx="10" fill="#070b10" stroke="#2d3b4e"/><text x="38" y="103" fill="#91a3b6" font-family="monospace" font-size="13">cd /Users/zub/CCB-TEMPLATE</text><text x="38" y="128" fill="#4be297" font-family="monospace" font-size="13">./ccb-template init ~/Desktop/mon-projet</text><text x="24" y="180" fill="#d9e3ed" font-size="16">✓ modèle Cloud par agent</text><text x="24" y="209" fill="#d9e3ed" font-size="16">✓ Git initialisé automatiquement</text></g><g transform="translate(1165 140)"><rect width="380" height="245" rx="18" fill="#151e29" stroke="#ffcd5c"/><circle cx="35" cy="38" r="21" fill="#2a2414" stroke="#ffcd5c"/><text x="35" y="46" text-anchor="middle" fill="#ffcd5c" font-size="22" font-weight="800">4</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">Agents CCB</text><text x="24" y="91" fill="#a982ff" font-size="17" font-weight="700">Manager</text><text x="120" y="91" fill="#d9e3ed" font-size="15">planifie et délègue</text><text x="24" y="125" fill="#35d8ff" font-size="17" font-weight="700">Graph</text><text x="120" y="125" fill="#d9e3ed" font-size="15">architecture, lecture seule</text><text x="24" y="159" fill="#4be297" font-size="17" font-weight="700">Developer</text><text x="120" y="159" fill="#d9e3ed" font-size="15">implémente et teste</text><text x="24" y="193" fill="#ffcd5c" font-size="17" font-weight="700">Reviewer</text><text x="120" y="193" fill="#d9e3ed" font-size="15">relit et valide</text></g><g transform="translate(90 430)"><rect width="450" height="280" rx="18" fill="#151e29" stroke="#35d8ff"/><circle cx="35" cy="38" r="21" fill="#102532" stroke="#35d8ff"/><text x="35" y="46" text-anchor="middle" fill="#35d8ff" font-size="22" font-weight="800">5</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">Brief de travail</text><rect x="24" y="76" width="402" height="54" rx="10" fill="#070b10" stroke="#2d3b4e"/><text x="38" y="109" fill="#4be297" font-family="monospace" font-size="15">./ccb-template brief ~/Desktop/mon-projet</text><text x="28" y="166" fill="#d9e3ed" font-size="16">• Objectif  • Périmètre</text><text x="28" y="197" fill="#d9e3ed" font-size="16">• Critères d’acceptation</text><text x="28" y="228" fill="#d9e3ed" font-size="16">• Risques, hypothèses, validation</text><text x="28" y="260" fill="#35d8ff" font-size="15">Terminer par une ligne contenant uniquement : .</text></g><g transform="translate(575 430)"><rect width="450" height="280" rx="18" fill="#151e29" stroke="#a982ff"/><circle cx="35" cy="38" r="21" fill="#241b3b" stroke="#a982ff"/><text x="35" y="46" text-anchor="middle" fill="#a982ff" font-size="22" font-weight="800">6</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">Prompt du manager</text><rect x="24" y="76" width="402" height="82" rx="10" fill="#070b10" stroke="#2d3b4e"/><text x="38" y="105" fill="#4be297" font-family="monospace" font-size="14">./ccb-template manager-prompt ~/Desktop/</text><text x="38" y="130" fill="#4be297" font-family="monospace" font-size="14">mon-projet brief-YYYYMMDD-HHMMSS.md</text><text x="28" y="198" fill="#d9e3ed" font-size="16">Copier la sortie dans le manager CCB.</text><text x="28" y="232" fill="#a982ff" font-size="16">Manager → Graph → Developer → Reviewer</text></g><g transform="translate(1060 430)"><rect width="450" height="280" rx="18" fill="#151e29" stroke="#4be297"/><circle cx="35" cy="38" r="21" fill="#102a21" stroke="#4be297"/><text x="35" y="46" text-anchor="middle" fill="#4be297" font-size="22" font-weight="800">7</text><text x="70" y="47" fill="#f4f8fb" font-size="23" font-weight="700">Lancer CCB</text><rect x="24" y="76" width="402" height="82" rx="10" fill="#070b10" stroke="#2d3b4e"/><text x="38" y="105" fill="#4be297" font-family="monospace" font-size="15">cd ~/Desktop/mon-projet</text><text x="38" y="132" fill="#4be297" font-family="monospace" font-size="15">ccb</text><text x="28" y="198" fill="#d9e3ed" font-size="16">Codex reste le copilote.</text><text x="28" y="229" fill="#d9e3ed" font-size="16">CCB orchestre les agents localement.</text></g></g><g font-family="Inter,Segoe UI,Arial"><rect x="55" y="750" width="480" height="105" rx="18" fill="#111923" stroke="#2d3b4e"/><text x="78" y="783" fill="#35d8ff" font-size="19" font-weight="700">Rôles à retenir</text><text x="78" y="817" fill="#d9e3ed" font-size="15">ChatGPT = explorer · Codex = cadrer et vérifier</text><text x="78" y="841" fill="#d9e3ed" font-size="15">CCB Manager = orchestrer · agents = analyser, coder, valider</text><rect x="560" y="750" width="420" height="105" rx="18" fill="#111923" stroke="#4be297"/><text x="583" y="783" fill="#4be297" font-size="19" font-weight="700">Token optimization</text><text x="583" y="817" fill="#d9e3ed" font-size="15">RTK + Tilth activés par défaut</text><text x="583" y="841" fill="#4be297" font-family="monospace" font-size="15">--no-token-optimization</text><rect x="1005" y="750" width="540" height="105" rx="18" fill="#111923" stroke="#ffcd5c"/><text x="1028" y="783" fill="#ffcd5c" font-size="19" font-weight="700">Règle importante</text><text x="1028" y="817" fill="#d9e3ed" font-size="15">Codex aide à décider ; le manager CCB coordonne</text><text x="1028" y="841" fill="#d9e3ed" font-size="15">Graph, Developer et Reviewer.</text></g></svg>