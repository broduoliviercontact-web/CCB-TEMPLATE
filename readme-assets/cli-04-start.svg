<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Étape 4 — Valider et lancer CCB"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#edf4fb}.cmd{fill:#4be297;font-weight:700}</style><rect width="1400" height="620" rx="24" fill="url(#bg)"/><g opacity=".2" stroke="#26364b"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400M0 600H1400"/><path d="M140 0V620M280 0V620M420 0V620M560 0V620M700 0V620M840 0V620M980 0V620M1120 0V620M1260 0V620"/></g><rect x="42" y="34" width="12" height="58" rx="6" fill="#4be297"/><text class="ui" x="76" y="70" fill="#f7fbff" font-size="34" font-weight="700">Étape 4 — Valider et lancer CCB</text><text class="ui" x="76" y="106" fill="#91a3b6" font-size="20">Le binaire officiel global ouvre le workspace multi-agents dans tmux.</text><rect x="42" y="145" width="1316" height="380" rx="18" fill="#070b10" stroke="#2d3b4e" stroke-width="2"/><circle cx="72" cy="174" r="7" fill="#ff6b73"/><circle cx="96" cy="174" r="7" fill="#ffcd5c"/><circle cx="120" cy="174" r="7" fill="#4be297"/><text class="ui" x="1215" y="181" fill="#91a3b6" font-size="15">Terminal</text><g class="t"><text class="cmd" x="76" y="220">$ cd ~/Desktop/mon-projet</text><text class="cmd" x="76" y="254">$ ccb config validate</text><text class="cmd" x="76" y="308">$ ccb</text><text x="76" y="366">Raccourcis utiles après le lancement :</text><text x="76" y="402">  Ctrl-b puis d    détacher la session tmux</text><text x="76" y="436">  tmux attach      rattacher la session</text><text x="76" y="470">  ccb kill         arrêter explicitement le workspace</text></g><circle cx="58" cy="568" r="4" fill="#4be297"/><text class="ui" x="76" y="575" fill="#91a3b6" font-size="18">Chaque commande « ccb » désigne le binaire officiel installé globalement.</text></svg>