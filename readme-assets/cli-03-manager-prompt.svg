<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Étape 3 — Générer le prompt du manager"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#edf4fb}.cmd{fill:#4be297;font-weight:700}</style><rect width="1400" height="700" rx="24" fill="url(#bg)"/><g opacity=".2" stroke="#26364b"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400M0 600H1400"/><path d="M140 0V700M280 0V700M420 0V700M560 0V700M700 0V700M840 0V700M980 0V700M1120 0V700M1260 0V700"/></g><rect x="42" y="34" width="12" height="58" rx="6" fill="#a982ff"/><text class="ui" x="76" y="70" fill="#f7fbff" font-size="34" font-weight="700">Étape 3 — Générer le prompt du manager</text><text class="ui" x="76" y="106" fill="#91a3b6" font-size="20">Copier exactement la sortie dans la conversation du manager CCB.</text><rect x="42" y="145" width="1316" height="465" rx="18" fill="#070b10" stroke="#2d3b4e" stroke-width="2"/><circle cx="72" cy="174" r="7" fill="#ff6b73"/><circle cx="96" cy="174" r="7" fill="#ffcd5c"/><circle cx="120" cy="174" r="7" fill="#4be297"/><text class="ui" x="1215" y="181" fill="#91a3b6" font-size="15">Terminal</text><g class="t"><text class="cmd" x="76" y="220">$ ./ccb-template manager-prompt ~/Desktop/mon-projet brief-YYYYMMDD-HHMMSS.md</text><text x="76" y="270">You are the CCB manager for this project.</text><text x="76" y="320">Read .ccb/briefs/brief-YYYYMMDD-HHMMSS.md and treat it as the requested scope.</text><text x="76" y="352">First confirm the objective, assumptions, acceptance criteria and risks.</text><text x="76" y="384">Then delegate architecture analysis to graph, implementation only to developer,</text><text x="76" y="416">and independent validation to reviewer.</text><text x="76" y="466">Follow .ccb/AGENT_POLICY.md and do not modify application files yourself.</text><text x="76" y="498">Report concise progress, validation evidence and any decision that needs</text><text x="76" y="530">the user's approval.</text></g><circle cx="58" cy="650" r="4" fill="#a982ff"/><text class="ui" x="76" y="657" fill="#91a3b6" font-size="18">Le manager planifie et délègue ; il ne modifie pas lui-même les fichiers applicatifs.</text></svg>